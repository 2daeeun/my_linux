###################
### 모니터 설정 ###
###################

# https://wiki.hyprland.org/Configuring/Monitors/ 참고

# 모니터의 일반적인 구성은 다음과 같습니다.
# monitor = name, resolution, position, scale
# monitor = , highrr, auto, 1
# 모니터 정보 보는 방법 
# hyprctl monitors

## === Monitors (집)===
monitor   = eDP-1,  2160x1350@59.74,  4892x1680,  1.0                 # 내장 모니터
monitor   = DP-5,   1920x1080@60.0,   4892x600,   1.0                 # 외장 모니터 1 (중앙)
monitor   = DP-6,   1920x1080@60.32,  3812x600,   1.0,  transform,1   # 외장 모니터 2 (왼쪽)
workspace = 3,  monitor:eDP-1,  default:true    # 워크스페이스 3
workspace = 2,  monitor:DP-5,   default:true    # 워크스페이스 1
workspace = 1,  monitor:DP-6,   default:true    # 워크스페이스 2

## === Monitors (델 워크스테이션)===
# monitor   = DP-1,   1920x1080@60.0,   4892x0,  1.0                 # 외장 모니터 1 (중앙)
# monitor   = DP-2,   1920x1080@60.32,  3812x0,  1.0,  transform,1   # 외장 모니터 2 (왼쪽)
# workspace = 1,  monitor:DP-1,   default:true    # 워크스페이스 1
# workspace = 2,  monitor:DP-2,   default:true    # 워크스페이스 2
# cursor {
#   no_hardware_cursors = true  # transform(회전) 모니터에서 hw cursor 데드존/좌표 버그 회피
# }

## === Monitors (연구실 1)===
# monitor   = eDP-1,  2160x1350@59.74,  4892x0,     1.0                 # 내장 모니터
# monitor   = DP-5,   2560x1440@29.99,  4892x1350,  1.0                 # 외장 모니터 1 (중앙)
# monitor   = DP-6,   2560x1440@29.99,  3452x1350,  1.0,  transform,1   # 외장 모니터 2 (왼쪽)
# workspace = 9,  monitor:eDP-1,  default:true    # 워크스페이스 10
# workspace = 2,  monitor:DP-5,   default:true    # 워크스페이스 1
# workspace = 1,  monitor:DP-6,   default:true    # 워크스페이스 2

## === Monitors (연구실 2)===
# monitor   = DP-5,   2560x1440@29.99,  4892x0,     1.0                 # 외장 모니터 1 (중앙)
# monitor   = DP-6,   2560x1440@29.99,  3452x0,     1.0,  transform,1   # 외장 모니터 1 (왼쪽)
# monitor   = eDP-1,  2160x1350@59.74,  4892x1440,  1.0                 # 내장 모니터
# workspace = 0,  monitor:eDP-1,  default:true    # 워크스페이스 10
# workspace = 1,  monitor:DP-6,   default:true    # 워크스페이스 1
# workspace = 2,  monitor:DP-5,   default:true    # 워크스페이스 2


#####################
### 프로그램 설정 ###
#####################

# https://wiki.hyprland.org/Configuring/Keywords/ 참고

# 사용하는 프로그램을 설정하십시오.
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun -font "Hack Nerd Font Regular 18" -show-icons


# 자동 실행
# 필수 프로세스(예: 알림 데몬, 상태 표시줄 등)를 자동 실행합니다.
# 또는 실행할 프로그램을 설정하십시오.

exec-once = dbus-launch dunst --config ~/.config/dunst/dunstrc
exec-once = tlp start
exec-once = discord --start-minimized
exec-once = sh -c 'sleep 30; pkill -TERM -x Discord'  # 30초 뒤에 discord 종료
exec-once = numlockx on
exec-once = copyq
exec-once = mako
exec-once = waybar
exec-once = hypridle

# 로그인 시 브릿지 자동 실행
exec-once = clipboard-sync &

# # Kime 실행
# exec-once = kime
#
# # Kime 환경변수 설정
# env = XDG_CURRENT_DESKTOP,Hyprland
# env = GLFW_IM_MODULE,ibus      # kitty가 Wayland text-input(kime) 활성화
# env = GTK_IM_MODULE,kime
# env = QT_IM_MODULE,kime
# env = XMODIFIERS,@im=kime
# # exec-once = kime-xim &

# fcitx5 자동 실행
# exec-once = fcitx5 -d --replace
exec-once = fcitx5 -d

# 환경변수
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = GLFW_IM_MODULE,fcitx     # kitty용

######################
### 환경 변수 설정 ###
######################

# https://wiki.hyprland.org/Configuring/Environment-variables/ 참고

# XCursor(마우스 커서) 테마 변경
env = HYPRCURSOR_SIZE=48
env = XCURSOR_THEME,Oxygen 01 Yellow
env = XCURSOR_SIZE,48

######################
### 외형 및 스타일 ###
######################

# https://wiki.hyprland.org/Configuring/Variables/ 참고

# https://wiki.hyprland.org/Configuring/Variables/#general 참고
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types에서 색상에 대한 정보 확인 가능
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # true로 설정하면 창의 테두리나 간격을 클릭하여 크기를 조정할 수 있음
    resize_on_border = true

    # 이 옵션을 활성화하기 전에 https://wiki.hyprland.org/Configuring/Tearing/ 문서를 참고하십시오.
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration 참고
decoration {
    rounding = 10
    rounding_power = 2

    # 포커스를 받은 창과 받지 않은 창의 투명도 설정
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur 참고
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations 참고
animations {
    enabled = yes, please :)

    # 기본 애니메이션 설정, 자세한 내용은 https://wiki.hyprland.org/Configuring/Animations/ 참고

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# https://wiki.hyprland.org/Configuring/Workspace-Rules/ 참고
# "스마트 간격" / "창이 하나만 있을 때 간격 없음"
# 사용하려면 주석을 해제하십시오.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# https://wiki.hyprland.org/Configuring/Dwindle-Layout/ 참고
dwindle {
    preserve_split = true # 활성화하는 것이 좋음.
}

# https://wiki.hyprland.org/Configuring/Master-Layout/ 참고
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc 참고
misc {
    force_default_wallpaper = 0 # 0 또는 1로 설정하면 애니메이션 마스코트 배경을 비활성화함.
    disable_hyprland_logo = false # true로 설정하면 Hyprland 로고 및 애니메이션 캐릭터 배경을 비활성화함.
}

# 바탕화면 설정
# exec = swww init && swww img ~/.config/hypr/thinkpad_wallpaper.png
exec-once = hyprpaper

#################
### 입력 설정 ###
#################

# https://wiki.hyprland.org/Configuring/Variables/#input 참고
input {
    kb_layout = 
    kb_variant =
    kb_model =
    kb_options = korean:ralt_hangul,korean:rctrl_hanja
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 ~ 1.0, 0은 기본값.

    touchpad {
        # natural_scroll = false
        natural_scroll = true
        scroll_factor = 1.0
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures 참고
# gestures {
#     workspace_swipe = false
# }

# 개별 장치 설정 예시
# https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs 참고
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}



#################
### 키 바인딩 ###
#################

# https://wiki.hyprland.org/Configuring/Keywords/ 참고
$mainMod = SUPER # "Windows" 키를 주 수정 키로 설정

# 키 바인딩 예제, 자세한 내용은 https://wiki.hyprland.org/Configuring/Binds/ 참고
bind = $mainMod, X, killactive
bind = $alt, F4, killactive

# 프로그램 키 바인딩
bind = $mainMod, T, exec, $terminal               # 터미널 실행
bind = $mainMod, Return, exec, $terminal          # 터미널 실행
bind = $mainMod, D, exec, $menu                   # Rofi 실행
bind = $mainMod, N, exec, terminator -e nmtui     # Network Manager (nmtui) 실행
bind = $mainMod, M, exec, pavucontrol             # 오디오 설정 (Pavucontrol) 실행
# bind = $mainMod, B, exec, google-chrome-stable --ozone-platform=x11
bind = $mainMod, B, exec, google-chrome-stable
bind = CTRL_ALT, H, exec, copyq show              # 클립보드 관리자 (CopyQ) 실행
bind = $mainMod, semicolon, exec, pcmanfm         # 파일 관리자 (PCManFM) 실행
# bind = $mainMod, semicolon, exec, dolphin         # 파일 관리자 (dolphin) 실행
bind = , XF86Calculator, exec, mate-calc          # Mate Calculator 실행
bind = $mainMod ALT, L, exec, hyprlock            # 화면보호기(hyprlock) 실행
bind = $mainMod ALT, H, exec, systemctl hibernate # 시스템 최대 절전 모드
bind = $mainMod ALT, S, exec, systemctl suspend   # 시스템 절전 모드

# 덮개 닫아도 suspend 안 되게 (이번 부팅 한정, 터미널 창 유지)
$lidInhibitCmd = kitty --hold sh -c 'echo "==============================================="; echo "덮개 닫아도 suspend 안 되게 유지"; echo "  실행 중: systemd-inhibit --what=handle-lid-switch"; echo "  이 창을 닫거나 Ctrl+C 하면 해제됩니다."; echo "==============================================="; echo; systemd-inhibit --what=handle-lid-switch --why="작업 유지" sleep infinity'
bind = $mainMod ALT, I, exec, $lidInhibitCmd      # 덮개 닫아도 suspend

# Hyprland: kitty 폰트 크기 조절용 단축키
bind = $mainMod+ALT, 1, exec, kitty @ set-font-size 10
bind = $mainMod+ALT, 2, exec, kitty @ set-font-size 18
bind = $mainMod+ALT, 3, exec, kitty @ set-font-size 26


# 키 바인딩
# bind = $mainMod SHIFT, E, exit          # Hyprland 종료, hyprctl dispatch exit
bind = $mainMod, X, killactive          # 창 종료 1
bind = $alt, F4, killactive             # 창 종료 2
bind = $mainMod, V, togglefloating,     # 창을 플로팅 상태로 전환
bind = $mainMod, H, layoutmsg, togglesplit  # 레이아웃에서 분할 방식 전환 (Horizontal, Vertical)
bind = $mainMod, W, fullscreen          # FullScreen
bind = $mainMod, F, togglefloating,     # 창을 플로팅 상태로 전환

# Alt+Tab
binds {
  workspace_back_and_forth = true
}
bind = ALT, TAB, focuscurrentorlast


# 방향키로 창 이동
bind = $mainMod SHIFT, J, movewindow, l       # 왼  쪽
bind = $mainMod SHIFT, L, movewindow, r       # 오른쪽
bind = $mainMod SHIFT, I, movewindow, u       # 위
bind = $mainMod SHIFT, K, movewindow, d       # 아  래

# 키보드로 창 이동
bind = $mainMod SHIFT, left, movewindow, l    # 왼  쪽
bind = $mainMod SHIFT, right, movewindow, r   # 오른쪽
bind = $mainMod SHIFT, up, movewindow, u      # 위
bind = $mainMod SHIFT, down, movewindow, d    # 아  래

# 방향키로 창 포커스 이동
bind = $mainMod, left, movefocus, l           # 왼  쪽
bind = $mainMod, right, movefocus, r          # 오른쪽
bind = $mainMod, up, movefocus, u             # 위
bind = $mainMod, down, movefocus, d           # 아  래

# 키보드로 창 포커스 이동
bind = $mainMod, J, movefocus, l              # 왼  쪽
bind = $mainMod, L, movefocus, r              # 오른쪽
bind = $mainMod, I, movefocus, u              # 위
bind = $mainMod, K, movefocus, d              # 아  래


# 주 수정 키(mainMod) + [0-9]로 워크스페이스 전환
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# 주 수정 키(mainMod) + SHIFT + [0-9]로 현재 창을 특정 워크스페이스로 이동
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# 방향키로 워크스페이스 전환
bind = $mainMod CTRL, right, workspace, e+1
bind = $mainMod CTRL, left, workspace, e-1

# 마우스로 창 크기 조절
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# 키보드로 창 크기 조절
# Resize 모드 진입
bind = $mainMod, R, submap, resize

# Resize 모드에서 방향키로 창 크기 조절
submap = resize
binde = , left,  resizeactive, -20 0
binde = , right, resizeactive, 20 0
binde = , up,    resizeactive, 0 -20
binde = , down,  resizeactive, 0 20
binde = , j, resizeactive, -20 0
binde = , l, resizeactive, 20 0
binde = , i, resizeactive, 0 -20
binde = , k, resizeactive, 0 20
bind = , escape, submap, reset
bind = , enter,  submap, reset

# Resize 모드 종료
submap = reset


# 노트북 멀티미디어 키 (볼륨 및 LCD 밝기 조절)
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-

# playerctl이 필요함 (미디어 컨트롤 키)
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### 창 및 워크스페이스 설정 ###
##############################

# 창 규칙 관련 정보: https://wiki.hyprland.org/Configuring/Window-Rules/
# 워크스페이스 규칙 관련 정보: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# 창 규칙 예제 v1
# windowrule = float, ^(kitty)$

# 창 규칙 예제 v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# # 애플리케이션의 창 최대화 요청을 무시합니다. 이 설정이 유용할 수 있습니다.
# windowrulev2 = suppressevent maximize, class:.* (더 이상 지원 안 되는 구문)
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# # XWayland에서 창 드래그 관련 문제 해결
# windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0 (더 이상 지원 안 되는 구문)
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    # match:floating = true
    match:fullscreen = false
    # match:pinned = false
    no_focus = true
}





