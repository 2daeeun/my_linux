# ~/.config/hypr/hyprlock.conf

# BACKGROUND
background {
  monitor =
    path = ~/.config/hypr/login_wallpaper.png
    blur_passes = 2
    blur_size   = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
  no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Day-Month-Date
label {
  monitor =
    text = cmd[update:1000] LC_TIME=ko_KR.UTF-8 date '+%Y년 %m월 %d일, %A'
    color = rgba(255, 255, 255, .65)
    font_size = 32
    font_family = SF Pro Display Bold
    position = 0, 420
    halign = center
    valign = center
}

# TIME
label {
  monitor =
	text = cmd[update:1000] date '+<span>%p %I:%M:%S</span>'
    color = rgba(255, 255, 255, .65)
    font_size = 90
    font_family = SF Pro Display Bold
    position = 0, 300
    halign = center
    valign = center
}

# PASSWORD-TEXT
label {
  monitor =
    text = Password:
    color = rgba(255, 255, 255, .55)
    font_size = 17
    font_family = SF Pro Display Bold 
    position = -90, -70
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
  monitor =
    size = 350, 40
    rounding = 0
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(86, 90, 90, 1)
    inner_color = rgba(40, 40, 40, 1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99"></span></i>
    hide_input = false
    position = 30, -125
    halign = center
    valign = center
}

# CPU/메모리/배터리 상태 출력
label {
  monitor =
    text = cmd[update:1000] ~/.config/hypr/stats.sh
    color = rgba(255, 255, 255, .55)
    font_size   = 32
    font_family = SF Pro Display Bold
    halign  = left   # 가로 기준을 왼쪽으로
    valign  = bottom    # 세로 기준을 아래쪽으로
    position = 10, 10  # 왼쪽 상단에서 x=10px, y=10px 만큼 떨어진 위치
}
